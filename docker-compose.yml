version: '3.8'

services:
  web:
    build: .
    command: gunicorn swordmap_project.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./game_config.json:/app/game_config.json
      - ./assets:/app/assets
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - matfyzgame

  game_loop:
    build: .
    command: python manage.py process_game_state
    volumes:
      - ./data:/app/data
      - ./game_config.json:/app/game_config.json
    env_file:
      - .env
    depends_on:
      - web
      - db
    networks:
      - matfyzgame
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "matfyzgame"
    volumes:
      - "db-data:/var/lib/postgresql/data"
    networks:
      - matfyzgame

volumes:
  db-data:

networks:
  matfyzgame:
