{% load static %}
<!doctype html>
<html>
  <head>
    <title>KSP bojovka - Statistiky hry</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'game/favicon.svg' %}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #222;
        color: #fff;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
      }
      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      .tab {
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #555;
        background: #2d2d2d;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      .tab.active {
        background: #4a4a4a;
        border-color: #7a7a7a;
      }
      .panel {
        background: #111;
        border: 1px solid #444;
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 16px;
      }
      .chart-container {
        position: relative;
        width: 100%;
        height: 320px;
      }
      #score-chart {
        width: 100% !important;
        height: 100% !important;
      }
      #replay-map {
        width: 100%;
        height: 55vh;
        min-height: 380px;
        border-radius: 8px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .controls input[type="range"] {
        flex: 1;
        min-width: 220px;
      }
      .small {
        color: #bbb;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="tabs">
        <a href="{% url 'index' %}" class="tab">Týmy</a>
        <a href="{% url 'rules' %}" class="tab">Pravidla</a>
        <a href="{% url 'stats' %}" class="tab active">Statistiky</a>
      </div>

      <div class="panel">
        <h2 style="margin-top: 0">Body během hry</h2>
        <div class="chart-container">
          <canvas id="score-chart"></canvas>
        </div>
      </div>

      <div class="panel">
        <h2 style="margin-top: 0">Animace mapy</h2>
        <div id="replay-map"></div>
        <div class="controls" style="margin-top: 12px">
          <button id="play-pause" type="button">Přehrát</button>
          <input id="timeline" type="range" min="0" max="0" value="0" step="1" />
          <span id="time-label">t=0 s</span>
        </div>
        <p class="small" style="margin-bottom: 0">Snapshot se ukládá po minutě; při přehrávání je pro každou sekundu zobrazen stav odpovídající dané minutě.</p>
      </div>
    </div>

    <script>
      const map = L.map("replay-map", { zoomControl: true });
      map.createPane("edgesPane");
      map.getPane("edgesPane").style.zIndex = 410;
      map.createPane("zonesPane");
      map.getPane("zonesPane").style.zIndex = 420;

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 20,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      let chart = null;
      let zoneLayers = new Map();
      let zoneMeta = new Map();
      let edgeLayers = new Map();
      let timelineData = [];
      let isPlaying = false;
      let playTimer = null;

      function getStateAtSecond(second) {
        if (!timelineData.length) {
          return null;
        }
        const minute = Math.floor(second / 60);
        let selected = timelineData[0];
        for (const item of timelineData) {
          if (item.minute_index <= minute) {
            selected = item;
          } else {
            break;
          }
        }
        return selected;
      }

      function zoneStyleForState(zoneInfo, zoneState, teamsByName) {
        let fill = "#FFFFFF";
        if (zoneState && zoneState.owner && teamsByName[zoneState.owner]) {
          fill = teamsByName[zoneState.owner].color;
        }
        let stroke = "#333";
        let weight = zoneInfo.is_base ? 4 : 2;

        if (zoneState && zoneState.status === "CAPTURING" && zoneState.capturing_team && teamsByName[zoneState.capturing_team]) {
          stroke = teamsByName[zoneState.capturing_team].color;
          weight = 5;
        }

        return {
          color: stroke,
          weight,
          fillColor: fill,
          fillOpacity: 0.9,
          radius: zoneInfo.is_base ? 16 : 11,
        };
      }

      function renderMapFrame(second, teamsByName) {
        const state = getStateAtSecond(second);
        if (!state) {
          return;
        }

        const byZoneId = {};
        (state.zones || []).forEach((z) => {
          byZoneId[z.id] = z;
        });

        zoneLayers.forEach((layer, zoneId) => {
          const info = zoneMeta.get(zoneId);
          const zoneState = byZoneId[zoneId] || null;
          layer.setStyle(zoneStyleForState(info, zoneState, teamsByName));
        });

        edgeLayers.forEach((edge) => {
          const s1 = byZoneId[edge.a];
          const s2 = byZoneId[edge.b];
          const c1 = s1 && s1.owner && teamsByName[s1.owner] ? teamsByName[s1.owner].color : null;
          const c2 = s2 && s2.owner && teamsByName[s2.owner] ? teamsByName[s2.owner].color : null;
          edge.inner.setStyle({ color: c1 && c2 && c1 === c2 ? c1 : "#ffffff" });
        });

        const label = document.getElementById("time-label");
        const mm = Math.floor(second / 60);
        const ss = second % 60;
        label.textContent = `t=${mm}:${ss.toString().padStart(2, "0")}`;
      }

      function setupReplay(data) {
        const teamsByName = {};
        (data.teams || []).forEach((team) => {
          teamsByName[team.name] = team;
        });

        const zones = data.zones || [];
        timelineData = data.timeline || [];

        zones.forEach((zone) => {
          zoneMeta.set(zone.id, zone);
        });

        const bounds = L.latLngBounds([]);
        zones.forEach((zone) => {
          const layer = L.circleMarker([zone.lat, zone.lng], {
            pane: "zonesPane",
            color: "#333",
            weight: zone.is_base ? 4 : 2,
            fillColor: "#FFFFFF",
            fillOpacity: 0.9,
            radius: zone.is_base ? 16 : 11,
          }).addTo(map);
          layer.bindTooltip(zone.name, {
            permanent: true,
            direction: "top",
            offset: [0, -10],
          });
          zoneLayers.set(zone.id, layer);
          bounds.extend([zone.lat, zone.lng]);
        });

        const seen = new Set();
        zones.forEach((zone) => {
          (zone.adjacent || []).forEach((otherId) => {
            const a = Math.min(zone.id, otherId);
            const b = Math.max(zone.id, otherId);
            const key = `${a}-${b}`;
            if (seen.has(key)) {
              return;
            }
            seen.add(key);
            const other = zoneMeta.get(otherId);
            if (!other) {
              return;
            }

            const outer = L.polyline(
              [
                [zone.lat, zone.lng],
                [other.lat, other.lng],
              ],
              {
                pane: "edgesPane",
                color: "#333",
                weight: 6,
                opacity: 0.9,
              },
            ).addTo(map);

            const inner = L.polyline(
              [
                [zone.lat, zone.lng],
                [other.lat, other.lng],
              ],
              {
                pane: "edgesPane",
                color: "#fff",
                weight: 4,
                opacity: 0.95,
              },
            ).addTo(map);

            edgeLayers.set(key, { outer, inner, a, b });
          });
        });

        if (bounds.isValid()) {
          map.fitBounds(bounds, { padding: [10, 10] });
        }

        const maxSecond = timelineData.length ? timelineData[timelineData.length - 1].minute_index * 60 + 59 : 0;
        const slider = document.getElementById("timeline");
        slider.max = String(maxSecond);
        slider.value = "0";

        slider.addEventListener("input", () => {
          renderMapFrame(Number(slider.value), teamsByName);
        });

        const playPauseBtn = document.getElementById("play-pause");
        playPauseBtn.addEventListener("click", () => {
          isPlaying = !isPlaying;
          playPauseBtn.textContent = isPlaying ? "Pozastavit" : "Přehrát";

          if (!isPlaying) {
            if (playTimer) {
              clearInterval(playTimer);
              playTimer = null;
            }
            return;
          }

          playTimer = setInterval(() => {
            const current = Number(slider.value);
            if (current >= maxSecond) {
              isPlaying = false;
              playPauseBtn.textContent = "Přehrát";
              clearInterval(playTimer);
              playTimer = null;
              return;
            }
            slider.value = String(current + 1);
            renderMapFrame(current + 1, teamsByName);
          }, 1000);
        });

        renderMapFrame(0, teamsByName);
      }

      function setupChart(data) {
        const timeline = data.timeline || [];
        const teams = data.teams || [];
        const labels = timeline.map((s) => `min ${s.minute_index}`);

        const datasets = teams.map((team) => ({
          label: team.name,
          borderColor: team.color,
          backgroundColor: team.color,
          tension: 0.25,
          fill: false,
          data: timeline.map((snap) => {
            const row = snap.scores || {};
            return row[team.name] ? row[team.name].score : 0;
          }),
        }));

        const ctx = document.getElementById("score-chart").getContext("2d");
        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets,
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                ticks: { color: "#ddd" },
                grid: { color: "rgba(255,255,255,0.08)" },
              },
              y: {
                ticks: { color: "#ddd" },
                grid: { color: "rgba(255,255,255,0.08)" },
              },
            },
            plugins: {
              legend: {
                labels: { color: "#fff" },
              },
            },
          },
        });
      }

      fetch("{% url 'stats_timeline' %}")
        .then((r) => r.json())
        .then((data) => {
          setupChart(data);
          setupReplay(data);
        })
        .catch(() => {
          alert("Nepodařilo se načíst statistiky.");
        });
    </script>
  </body>
</html>
