{% load static %}
<!doctype html>
<html>
  <head>
    <title>KSP bojovka - Pravidla</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'game/favicon.svg' %}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #222;
        color: #fff;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      .tab {
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #555;
        background: #2d2d2d;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      .tab.active {
        background: #4a4a4a;
        border-color: #7a7a7a;
      }
      .rules-box {
        background: #111;
        border: 1px solid #444;
        border-radius: 10px;
        padding: 16px;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: "Consolas", "Monaco", monospace;
        font-size: 0.95rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="tabs">
        <a href="{% url 'index' %}" class="tab">Týmy</a>
        <a href="{% url 'rules' %}" class="tab active">Pravidla</a>
        <a href="{% url 'stats' %}" class="tab">Statistiky</a>
      </div>
      <div class="rules-box">
        <pre>{{ rules_text }}</pre>
      </div>
    </div>
  </body>
</html>
