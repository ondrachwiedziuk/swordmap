{% load static %}
<!doctype html>
<html>
  <head>
    <title>Grafovka - Pravidla</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'game/favicon.svg' %}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #222;
        color: #fff;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      .tab {
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #555;
        background: #2d2d2d;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      .tab.active {
        background: #4a4a4a;
        border-color: #7a7a7a;
      }
      .rules-box {
        background: #111;
        border: 1px solid #444;
        border-radius: 10px;
        padding: 16px;
        line-height: 1.6;
      }
      .rules-box h1,
      .rules-box h2,
      .rules-box h3 {
        margin: 1.1em 0 0.5em;
      }
      .rules-box h1:first-child,
      .rules-box h2:first-child,
      .rules-box h3:first-child {
        margin-top: 0;
      }
      .rules-box p {
        margin: 0 0 0.75em;
      }
      .rules-box ul,
      .rules-box ol {
        margin: 0 0 0.9em 1.4em;
        padding: 0;
      }
      .rules-box li {
        margin-bottom: 0.35em;
      }
      .rules-box code {
        background: #1d1d1d;
        border: 1px solid #333;
        border-radius: 4px;
        padding: 0 0.3em;
        font-family: "Consolas", "Monaco", monospace;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="tabs">
        <a href="{% url 'index' %}" class="tab">Týmy</a>
        <a href="{% url 'rules' %}" class="tab active">Pravidla</a>
        <a href="{% url 'stats' %}" class="tab">Statistiky</a>
      </div>
      <div class="rules-box">
        {{ rules_html }}
      </div>
    </div>
  </body>
</html>
